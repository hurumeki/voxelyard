name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じ PR への追加 push で古い実行は打ち切る
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: テスト
        run: npm test

      # デプロイと同じ経路（アセット生成 → 型チェック → 本番ビルド）を通す
      - name: ビルド
        run: npm run build
